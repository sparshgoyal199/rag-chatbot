<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spaceBg: '#0b0f19',
                        panelBg: 'rgba(17, 24, 39, 0.7)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>

<body>
    <div class="min-h-screen bg-spaceBg flex items-center justify-center p-6">
        <input type="file" id="file-input" name="file" accept=".pdf,.txt,.pkl">
    </div>
</body>
</html>
